<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VDS Instructor Training — Study Hub</title>
<style>
/* ============================================================
   Valley Driving School — Instructor Training Study Hub
   Calm & focused theme. Single file. Offline. Browser-saved.
   ============================================================ */
:root{
  --bg:#F6F5F0;
  --bg-tint:#EFEDE5;
  --surface:#FFFFFF;
  --surface-2:#FBFAF6;
  --border:#E7E4DA;
  --border-strong:#D9D5C8;
  --text:#2C312C;
  --text-2:#5E635C;
  --text-3:#8B8F86;
  --accent:#5E8B72;
  --accent-deep:#476C58;
  --accent-soft:#E4EEE7;
  --accent-soft-2:#D2E4D8;
  --amber:#C58A4B;
  --amber-soft:#F4E7D4;
  --rose:#B36A63;
  --rose-soft:#F1E0DD;
  --ring-track:#E7E4DA;
  --shadow:0 1px 2px rgba(44,49,44,.04), 0 6px 20px rgba(44,49,44,.05);
  --shadow-lg:0 4px 12px rgba(44,49,44,.06), 0 18px 50px rgba(44,49,44,.09);
  --radius:16px;
  --radius-sm:10px;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#1B1F1C;
  --bg-tint:#222722;
  --surface:#232823;
  --surface-2:#1F241F;
  --border:#333A33;
  --border-strong:#3F473F;
  --text:#E7E9E3;
  --text-2:#AEB4AB;
  --text-3:#7E847C;
  --accent:#7FB093;
  --accent-deep:#9AC4AC;
  --accent-soft:#26312A;
  --accent-soft-2:#2E3D33;
  --amber:#D6A36A;
  --amber-soft:#332b1f;
  --rose:#CD8B83;
  --rose-soft:#332624;
  --ring-track:#333A33;
  --shadow:0 1px 2px rgba(0,0,0,.2), 0 6px 20px rgba(0,0,0,.25);
  --shadow-lg:0 4px 12px rgba(0,0,0,.3), 0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-soft-2);color:var(--text)}
a{color:var(--accent-deep);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:264px;flex:0 0 264px;
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:22px 16px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px;}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:linear-gradient(150deg,var(--accent),var(--accent-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 10px rgba(71,108,88,.25);
}
.brand-mark svg{width:21px;height:21px}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text b{font-size:14.5px;letter-spacing:.1px}
.brand-text span{font-size:11.5px;color:var(--text-3)}

.nav-group-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;
  color:var(--text-3);font-weight:700;margin:14px 10px 4px;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:8.5px 11px;border-radius:10px;cursor:pointer;
  color:var(--text-2);font-size:14px;font-weight:500;
  border:1px solid transparent;transition:background .12s,color .12s;
  user-select:none;position:relative;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.nav-item .ic{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav-item.active .ic{opacity:1}
.nav-item .done-dot{
  margin-left:auto;width:7px;height:7px;border-radius:50%;
  background:var(--accent);opacity:0;transition:opacity .2s;
}
.nav-item.studied .done-dot{opacity:1}

.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:8px}
.mini-progress{padding:4px 10px}
.mini-progress .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-3);margin-bottom:5px}
.mini-bar{height:7px;border-radius:99px;background:var(--ring-track);overflow:hidden}
.mini-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-deep));border-radius:99px;transition:width .5s ease}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:14px;
  padding:13px 30px;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(160%) blur(10px);
  border-bottom:1px solid var(--border);
}
.hamburger{display:none;background:none;border:1px solid var(--border);border-radius:9px;
  width:38px;height:38px;cursor:pointer;color:var(--text-2);align-items:center;justify-content:center}
.crumb{font-size:13px;color:var(--text-3);font-weight:500}
.crumb b{color:var(--text);font-weight:600}
.topbar-spacer{flex:1}
.icon-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  height:38px;padding:0 13px;display:flex;align-items:center;gap:7px;cursor:pointer;
  color:var(--text-2);font-size:13px;font-weight:500;font-family:var(--sans);transition:.12s;
}
.icon-btn:hover{border-color:var(--border-strong);color:var(--text);background:var(--surface-2)}
.icon-btn svg{width:16px;height:16px}

.content{padding:30px;max-width:1080px;width:100%;margin:0 auto;flex:1}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Typography ---------- */
.page-title{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
.page-sub{color:var(--text-2);font-size:15px;margin:0 0 26px;max-width:62ch}
h2.sec{font-family:var(--serif);font-size:21px;font-weight:600;margin:34px 0 14px;letter-spacing:-.01em}
h2.sec:first-of-type{margin-top:8px}
.lead{font-size:15.5px;color:var(--text-2)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 24px}
.card+.card{margin-top:16px}
.grid{display:grid;gap:16px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}

/* ---------- Dashboard ---------- */
.hero{
  background:linear-gradient(135deg,var(--accent-soft),var(--surface) 78%);
  border:1px solid var(--border);border-radius:var(--radius);padding:26px 28px;
  display:flex;gap:26px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.hero-left{flex:1;min-width:240px}
.hero-eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-deep);font-weight:700}
.hero h1{font-family:var(--serif);font-size:27px;margin:7px 0 6px;font-weight:600;line-height:1.18}
.hero p{margin:0;color:var(--text-2);font-size:14.5px}
.countdown{display:flex;gap:12px}
.cd-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:13px 17px;text-align:center;min-width:74px;box-shadow:var(--shadow)}
.cd-box .n{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--accent-deep);line-height:1}
.cd-box .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin-top:5px}

.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:104px;height:104px;flex:0 0 104px}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--text)}
.ring .pct span{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em}

.stat{display:flex;flex-direction:column;gap:3px}
.stat .v{font-family:var(--serif);font-size:23px;font-weight:600}
.stat .k{font-size:12.5px;color:var(--text-3)}
.progress-line{margin-top:9px}
.progress-line .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.progress-line .row span:last-child{color:var(--text-3)}
.bar{height:9px;border-radius:99px;background:var(--ring-track);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.bar.accent>span{background:linear-gradient(90deg,var(--accent),var(--accent-deep))}
.bar.amber>span{background:linear-gradient(90deg,#dba968,var(--amber))}
.bar.rose>span{background:linear-gradient(90deg,#cf8c85,var(--rose))}

.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:13px}
.quick{display:flex;flex-direction:column;gap:9px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px;
  cursor:pointer;transition:.14s;text-align:left}
.quick:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}
.quick .qic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent-deep);
  display:flex;align-items:center;justify-content:center}
.quick .qic svg{width:18px;height:18px}
.quick b{font-size:14px}
.quick span{font-size:12px;color:var(--text-3)}

/* ---------- Numbers table / stat tiles ---------- */
.numtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:13px}
.numtile{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px;
  position:relative;overflow:hidden}
.numtile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.6}
.numtile .nt-v{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--accent-deep);line-height:1.15}
.numtile .nt-k{font-size:12.5px;color:var(--text-2);margin-top:5px}
.numtile .nt-note{font-size:11px;color:var(--text-3);margin-top:6px;font-style:italic}

/* ---------- Generic list/info ---------- */
.kv{display:flex;flex-direction:column;gap:0}
.kv .row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--border)}
.kv .row:last-child{border-bottom:0}
.kv .row .k{color:var(--text-2);font-size:14px}
.kv .row .v{font-weight:600;text-align:right;font-size:14px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent-deep)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.rose{background:var(--rose-soft);color:var(--rose)}
.pill.ghost{background:var(--bg-tint);color:var(--text-2)}

/* module / assessment cards */
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.item-card h3{margin:0 0 4px;font-size:16px;font-family:var(--serif);font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item-card .num-badge{flex:0 0 30px;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);
  color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:var(--sans)}
.item-card .form-badge{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.02em;
  background:var(--accent-deep);color:#fff;padding:3px 9px;border-radius:7px}
.item-card p{margin:8px 0 0;color:var(--text-2);font-size:14px}
.item-card .angle{margin-top:11px;padding:11px 13px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;font-size:13px;color:var(--text-2)}
.item-card .angle b{color:var(--accent-deep)}
.item-card .outcomes{margin-top:12px}
.item-card .outcomes .oc-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);font-weight:700;margin-bottom:6px}
.item-card .outcomes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.item-card .outcomes li{font-size:13px;color:var(--text-2);line-height:1.45}
.item-card .outcomes li::marker{color:var(--accent)}

/* prose */
.prose p{font-size:15px;color:var(--text-2);margin:0 0 13px}
.prose p strong,.prose .term{color:var(--text);font-weight:600}
.prose .term{color:var(--accent-deep)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;
  padding:13px 16px;margin:14px 0;font-size:14px;color:var(--text)}
.callout.amber{border-color:var(--amber);background:var(--amber-soft)}
.callout.rose{border-color:var(--rose);background:var(--rose-soft)}
.callout b{font-weight:600}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:700;background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl .resp{color:var(--accent-deep);font-style:italic}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}

/* studied toggle */
.studied-bar{display:flex;align-items:center;gap:14px;margin-top:30px;padding:16px 20px;
  background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:14px;flex-wrap:wrap}
.studied-bar .txt{flex:1;min-width:180px}
.studied-bar .txt b{font-size:14px}
.studied-bar .txt p{margin:2px 0 0;font-size:12.5px;color:var(--text-3)}
.btn{font-family:var(--sans);font-size:13.5px;font-weight:600;border-radius:10px;padding:10px 17px;cursor:pointer;
  border:1px solid var(--accent-deep);background:var(--accent-deep);color:#fff;transition:.14s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--accent-deep);border-color:var(--border-strong)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.done{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent-soft-2)}
.btn svg{width:16px;height:16px}

/* ---------- Checklist ---------- */
.check-section{margin-bottom:14px}
.check-section .csh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 4px 10px}
.check-section .csh h3{font-family:var(--serif);font-size:17px;margin:0;font-weight:600}
.check-section .csh .cnt{font-size:12.5px;color:var(--text-3);font-weight:600}
.check{display:flex;align-items:flex-start;gap:13px;padding:13px 16px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:.12s;margin-bottom:8px}
.check:hover{border-color:var(--border-strong);background:var(--surface-2)}
.check .box{flex:0 0 22px;width:22px;height:22px;border-radius:7px;border:2px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.14s}
.check .box svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.5);transition:.14s}
.check.on .box{background:var(--accent);border-color:var(--accent)}
.check.on .box svg{opacity:1;transform:scale(1)}
.check .lab{font-size:14.5px;color:var(--text);transition:.12s}
.check.on .lab{color:var(--text-3);text-decoration:line-through}

/* ---------- Pre-Trip ---------- */
.pt-tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);
  position:sticky;top:62px;z-index:20}
.pt-prog{flex:1;min-width:180px}
.pt-prog-lbl{font-size:13px;color:var(--text-2);margin-bottom:7px}
.pt-prog-lbl b{font-family:var(--serif);font-size:17px;color:var(--accent-deep)}
.pt-bar{height:9px}
.pt-actions{display:flex;gap:9px;flex-wrap:wrap}
.pt-actions .btn{padding:9px 13px;font-size:13px}

.pt-numbers{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 80%);border:1px solid var(--border);
  border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:20px}
.pt-num-head{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:14px}
.pt-num-head svg{width:19px;height:19px;color:var(--accent-deep)}
.pt-num-seg+.pt-num-seg{margin-top:14px}
.pt-seg-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);font-weight:700;margin-bottom:8px}
.pt-num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:10px}
.pt-num{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 13px;border-left:3px solid var(--border-strong)}
.pt-num.seq{border-left-color:var(--accent)}
.ptn-v{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--accent-deep);line-height:1.15}
.ptn-k{font-size:12.5px;color:var(--text);font-weight:600;margin-top:4px}
.ptn-d{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.4}
.pt-num-main{display:flex;gap:18px;align-items:flex-start}
.pt-num-cols{flex:1;min-width:0}
.pt-num-seg+.pt-num-seg{margin-top:14px}
.pt-gauge{flex:0 0 196px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px 6px}
.pt-gauge-h{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
.pt-gauge-s{font-size:11px;color:var(--text-3);margin:2px 0 4px;line-height:1.3}
.pt-gauge svg{width:100%;height:auto;display:block;font-family:var(--sans)}
.pt-gauge .ptg-num text{font-size:11px;font-weight:700;fill:var(--text)}
.pt-gauge .ptg-num .amber{fill:var(--amber)}
.pt-gauge .ptg-num .rose{fill:var(--rose)}
.pt-gauge .ptg-num .mut{fill:var(--text-3);font-weight:600}
.pt-gauge .ptg-lab text{font-size:9px;font-weight:800;letter-spacing:.04em;fill:var(--text-2)}
.pt-gauge .ptg-build{font-size:9.5px;font-weight:700;fill:var(--accent-deep)}
.pt-gauge .gf-tube{fill:var(--surface-2);stroke:var(--border-strong)}
.pt-gauge .gf-amber{fill:var(--amber)}
.pt-gauge .gf-rose{fill:var(--rose)}
.pt-gauge .gf-mut{fill:var(--text-3)}
.pt-gauge .gf-accent{fill:var(--accent-deep)}
.pt-gauge .gs-mut{stroke:var(--text-3)}
.pt-gauge .gs-amber{stroke:var(--amber)}
.pt-gauge .gs-rose{stroke:var(--rose)}
.pt-gauge .gs-ink{stroke:var(--text)}
.pt-gauge .gs-accent{stroke:var(--accent-deep)}
@media(max-width:760px){.pt-num-main{flex-direction:column}.pt-gauge{flex-basis:auto;align-self:center;max-width:240px;width:100%}}

.pt-phase{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.pt-phase.phase-complete{border-color:var(--accent-soft-2)}
.pt-phase-head{display:flex;align-items:center;gap:13px;padding:15px 18px;cursor:pointer;user-select:none;transition:background .12s}
.pt-phase-head:hover{background:var(--surface-2)}
.pt-ic{flex:0 0 36px;width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center}
.pt-ic svg{width:20px;height:20px}
.pt-phase.phase-complete .pt-ic{background:var(--accent);color:#fff}
.pt-ph-title{flex:1;min-width:0}
.pt-ph-title b{font-family:var(--serif);font-size:16.5px;font-weight:600;display:block;line-height:1.2}
.pt-ph-title span{font-size:12.5px;color:var(--text-3);display:block;margin-top:2px}
.pt-ph-count{font-size:12.5px;font-weight:700;color:var(--text-2);background:var(--bg-tint);border-radius:99px;padding:3px 11px;white-space:nowrap}
.pt-phase.phase-complete .pt-ph-count{background:var(--accent-soft);color:var(--accent-deep)}
.pt-chev{width:18px;height:18px;color:var(--text-3);transition:transform .2s;flex:0 0 18px}
.pt-phase.open .pt-chev{transform:rotate(180deg)}
.pt-phase-body{display:none;padding:4px 14px 14px}
.pt-phase.open .pt-phase-body{display:block}

.pt-check{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:11px;cursor:pointer;transition:background .12s;border:1px solid transparent}
.pt-check:hover{background:var(--surface-2)}
.pt-check+.pt-check{border-top:1px solid var(--border)}
.pt-check .box{flex:0 0 24px;width:24px;height:24px;border-radius:7px;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.14s}
.pt-check .box svg{width:15px;height:15px;color:#fff;opacity:0;transform:scale(.5);transition:.14s}
.pt-check.on .box{background:var(--accent);border-color:var(--accent)}
.pt-check.on .box svg{opacity:1;transform:scale(1)}
.pt-lab-t{font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pt-lab-d{font-size:13px;color:var(--text-2);margin-top:3px;line-height:1.5}
.pt-check.on .pt-lab-t{color:var(--text-3)}
.pt-check.on .pt-lab-d{color:var(--text-3)}
.ab-tag{font-size:9.5px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--amber);border-radius:5px;padding:1px 6px;line-height:1.5}
.pt-ph-range{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:700;color:var(--text-3);
  background:var(--bg-tint);border-radius:6px;padding:1px 7px;margin-right:9px;vertical-align:1px;letter-spacing:.01em}
.pt-phase.phase-complete .pt-ph-range{background:var(--accent-soft);color:var(--accent-deep)}
.pt-step{flex:0 0 26px;width:26px;height:22px;display:flex;align-items:center;justify-content:center;margin-top:1px;
  font-family:var(--serif);font-size:13px;font-weight:600;color:var(--text-3);background:var(--bg-tint);border-radius:6px;
  font-variant-numeric:tabular-nums;transition:.14s}
.pt-check.on .pt-step{color:var(--accent-deep);background:var(--accent-soft)}
.pt-grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--text-3);padding:13px 6px 4px}
.pt-grp:first-child{padding-top:5px}

@media print{
  .sidebar,.scrim,.topbar,.pt-tools,.pt-actions,.studied-bar{display:none!important}
  .main,.content{display:block}
  .pt-phase,.pt-numbers,.card{box-shadow:none!important;break-inside:avoid}
  .pt-phase-body{display:block!important}
  .pt-check{break-inside:avoid}
  body{background:#fff}
}

/* ---------- Flashcards ---------- */
.fc-stage{display:flex;flex-direction:column;align-items:center;gap:20px}
.fc-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;width:100%}
.fc-deck-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:.12s}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.active{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
.flashcard{width:100%;max-width:560px;height:300px;perspective:1600px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:20px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.fc-face .tag{position:absolute;top:16px;left:18px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text-3);font-weight:700}
.fc-face .hint{position:absolute;bottom:16px;font-size:11.5px;color:var(--text-3)}
.fc-front .q{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.3}
.fc-back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--accent-soft),var(--surface) 80%)}
.fc-back .a{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--accent-deep);line-height:1.25}
.fc-back .a small{display:block;font-family:var(--sans);font-size:14px;color:var(--text-2);font-weight:500;margin-top:10px;line-height:1.5}
.fc-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.round-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:.12s}
.round-btn:hover{border-color:var(--border-strong);color:var(--text);background:var(--surface-2)}
.round-btn svg{width:20px;height:20px}
.fc-progress{font-size:13px;color:var(--text-3);min-width:74px;text-align:center}
.judge{display:flex;gap:10px}
.judge .btn{padding:9px 16px}
.btn.review{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-soft)}
.btn.know{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent-soft-2)}

/* ---------- Quiz ---------- */
.quiz-wrap{max-width:680px;margin:0 auto}
.q-progress-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.q-progress-top .bar{flex:1}
.q-num{font-size:13px;color:var(--text-3);font-weight:600;white-space:nowrap}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);padding:28px}
.q-text{font-family:var(--serif);font-size:21px;font-weight:600;margin:0 0 20px;line-height:1.35}
.q-opt{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1.5px solid var(--border);
  border-radius:12px;cursor:pointer;margin-bottom:10px;transition:.12s;font-size:15px;background:var(--surface)}
.q-opt:hover{border-color:var(--accent);background:var(--surface-2)}
.q-opt .mk{flex:0 0 26px;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--text-2)}
.q-opt.correct{border-color:var(--accent);background:var(--accent-soft)}
.q-opt.correct .mk{background:var(--accent);border-color:var(--accent);color:#fff}
.q-opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.q-opt.wrong .mk{background:var(--rose);border-color:var(--rose);color:#fff}
.q-opt.disabled{cursor:default;pointer-events:none;opacity:.62}
.q-opt.disabled.correct,.q-opt.disabled.wrong{opacity:1}
.q-explain{margin-top:6px;padding:13px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);
  font-size:14px;color:var(--text-2)}
.q-explain b{color:var(--text)}
.q-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.score-big{font-family:var(--serif);font-size:54px;font-weight:600;color:var(--accent-deep);line-height:1}
.result-card{text-align:center;padding:40px 28px}
.result-card .msg{font-size:16px;color:var(--text-2);margin:14px 0 26px}

/* ---------- Schedule ---------- */
.timeline{position:relative;margin-left:8px}
.day{display:flex;gap:18px;position:relative;padding-bottom:6px}
.day .spine{flex:0 0 24px;display:flex;flex-direction:column;align-items:center}
.day .node{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);
  display:flex;align-items:center;justify-content:center;z-index:2;flex:0 0 24px;margin-top:18px}
.day .node svg{width:12px;height:12px;color:var(--accent)}
.day.done .node{background:var(--accent);border-color:var(--accent)}
.day.done .node svg{color:#fff}
.day.today .node{border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.day .line{flex:1;width:2px;background:var(--border);margin:2px 0}
.day:last-child .line{display:none}
.day .body{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:15px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.day.today .body{border-color:var(--amber);background:linear-gradient(160deg,var(--amber-soft),var(--surface) 75%)}
.day .body .dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.day .body .dh .date{font-family:var(--serif);font-size:17px;font-weight:600}
.day .body .dh .dow{font-size:12.5px;color:var(--text-3)}
.day .body .focus{font-size:14px;color:var(--text-2);margin:4px 0 10px}
.day .body .note{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);
  padding:9px 12px;font-size:13.5px;color:var(--text);font-family:var(--sans);resize:vertical;min-height:38px}
.day .body .note::placeholder{color:var(--text-3)}
.day .body .day-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}

/* resources */
.res{display:flex;align-items:center;gap:14px;padding:15px 18px;background:var(--surface);border:1px solid var(--border);
  border-radius:13px;margin-bottom:10px;transition:.12s}
.res:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.res .ric{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-deep);
  display:flex;align-items:center;justify-content:center;flex:0 0 38px}
.res .ric svg{width:19px;height:19px}
.res .rb{flex:1;min-width:0}
.res .rb b{font-size:14.5px;display:block}
.res .rb span{font-size:12.5px;color:var(--text-3);word-break:break-all}
.res a.btn{flex:0 0 auto}

/* misc */
.note-muted{font-size:12.5px;color:var(--text-3);font-style:italic;margin-top:18px}
.divider{height:1px;background:var(--border);margin:26px 0}
.scrim{display:none;position:fixed;inset:0;background:rgba(20,24,20,.4);z-index:40}

/* ---------- Responsive ---------- */
@media(max-width:880px){
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .hamburger{display:flex}
  .scrim.show{display:block}
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr}
  .content{padding:22px 18px}
  .topbar{padding:11px 18px}
  .hero{padding:22px}
}
@media(max-width:520px){
  .countdown{flex-wrap:wrap}
  .icon-btn .lbl{display:none}
  .page-title{font-size:25px}
}
</style>
